<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coro</title>
<meta name="description" content="Something is circling back.">
<meta property="og:title" content="Coro">
<meta property="og:description" content="Something is circling back.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fefdfb'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23453320' stroke-width='3'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Spline+Sans+Mono:wght@400;500&amp;display=swap" rel="stylesheet">

<style>
  *{box-sizing:border-box}
  :root{
    --paper: oklch(0.99 0.005 80);
    --ink: oklch(0.27 0.045 78);
    --ink2: oklch(0.46 0.04 62);
    --ink3: oklch(0.63 0.035 62);
    --rule: oklch(0.27 0.045 78 / .16);
    --moss: oklch(0.32 0.055 100);
    --plum: oklch(0.755 0.124 60); --plum-ink: oklch(0.55 0.11 58);
    --amber: oklch(0.36 0.126 40);
  }
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Spline Sans Mono',ui-monospace,monospace;-webkit-font-smoothing:antialiased}
  .serif{font-family:'Newsreader',Georgia,serif}
  .mono{font-family:'Spline Sans Mono',ui-monospace,monospace;font-weight:400}
  #cover{position:relative;overflow:hidden;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 24px;background:var(--paper)}
  #cover-decor{position:absolute;inset:0;pointer-events:none}
  .cover-ring{position:absolute;top:50%;left:50%;border-radius:50%;border:1px solid var(--rule);transform:translate(-50%,-50%)}
  .cover-tick{position:absolute;top:50%;left:50%;width:1px;background:var(--rule);transform-origin:50% 300px}
  .cover-dot{position:absolute;border-radius:50%}
  .cover-mark{position:relative;width:100px;height:64px;margin:0 auto}
  .cover-mark span{position:absolute;width:34px;height:34px;border-radius:50%}
  .cover-corner{position:absolute;display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3)}
  .cover-corner i{width:5px;height:5px;border:1px solid var(--rule);transform:rotate(45deg);display:inline-block}
  @media (max-width: 620px){
    .cover-corner{font-size:9.5px;letter-spacing:.14em}
    #cover{padding:56px 20px}
  }
</style>
</head>
<body>

<section id="cover">
  <div id="cover-decor"></div>

  <div class="cover-corner" style="top:6%;left:8%"><i></i>No. 001</div>
  <div class="cover-corner" style="top:6%;right:8%"><i></i></div>

  <div class="cover-mark">
    <span style="left:0;top:14px;background:var(--moss)"></span>
    <span style="right:0;top:14px;background:var(--plum)"></span>
    <span style="left:33px;top:0;background:var(--amber)"></span>
  </div>

  <h1 class="serif" style="position:relative;margin:5vh 0 0;font-size:clamp(64px,11vw,148px);font-weight:400;letter-spacing:-.03em;line-height:1">coro</h1>

  <div class="mono" style="position:relative;margin-top:24px;font-size:14px;letter-spacing:.32em;text-transform:uppercase;color:var(--plum-ink)">Coming soon</div>

  <div class="serif" style="position:relative;margin-top:14px;font-size:19px;font-style:italic;letter-spacing:.01em;color:var(--ink2)">Something is circling back.</div>

  <div style="position:relative;margin-top:28px;display:flex;align-items:center;gap:10px">
    <span style="width:22px;height:1px;background:var(--plum)"></span>
    <span style="width:4px;height:4px;border-radius:50%;background:var(--amber)"></span>
    <span style="width:22px;height:1px;background:var(--moss)"></span>
  </div>

  <div class="cover-corner" style="bottom:5%;left:8%">Est. 2026</div>
</section>

<script>
(function(){
  var decor = document.getElementById('cover-decor');
  if(!decor) return;

  [60, 42].forEach(function(vh){
    var ring = document.createElement('div');
    ring.className = 'cover-ring';
    ring.style.width = vh + 'vh';
    ring.style.height = vh + 'vh';
    decor.appendChild(ring);
  });

  for(var i = 0; i < 36; i++){
    var deg = i * 10, major = i % 3 === 0;
    var tick = document.createElement('div');
    tick.className = 'cover-tick';
    tick.style.height = (major ? 9 : 5) + 'px';
    tick.style.opacity = major ? .5 : .3;
    tick.style.transform = 'translate(-50%,-300px) rotate(' + deg + 'deg)';
    decor.appendChild(tick);
  }

  var dotColors = ['var(--moss)', 'var(--plum)', 'var(--amber)'];
  var scatter = [
    {x:12,y:16,s:5,o:.5},{x:88,y:14,s:4,o:.4},{x:9,y:82,s:4,o:.4},{x:91,y:80,s:5,o:.5},
    {x:18,y:48,s:3,o:.35},{x:82,y:52,s:3,o:.35},{x:6,y:50,s:4,o:.3},{x:94,y:47,s:4,o:.3},
    {x:15,y:70,s:3,o:.3},{x:85,y:28,s:3,o:.3}
  ];
  scatter.forEach(function(d, i){
    var dot = document.createElement('div');
    dot.className = 'cover-dot';
    dot.style.left = d.x + '%';
    dot.style.top = d.y + '%';
    dot.style.width = d.s + 'px';
    dot.style.height = d.s + 'px';
    dot.style.opacity = d.o;
    dot.style.background = dotColors[i % 3];
    decor.appendChild(dot);
  });
})();
</script>

</body>
</html>
